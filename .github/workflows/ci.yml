name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Type-check
        run: npm run typecheck
      - name: Test renderer contracts
        run: npm run test:frontend
      - name: Lint
        run: npm run lint
      - name: Build production renderer
        run: npm run build

  backend:
    name: Backend and persistence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Validate imports and dependency graph
        run: |
          python -m pip check
          python -m compileall -q backend
      - name: Test intelligence and transcription pipelines
        run: python -m unittest discover -s backend/tests -v
      - name: Prove API persistence across restart
        shell: bash
        run: |
          set -euo pipefail
          export TARA_DATA_DIR="$RUNNER_TEMP/tara-ci-data"
          backend_pid=""
          cleanup() {
            if [ -n "$backend_pid" ]; then kill "$backend_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          start_backend() {
            python backend/main.py >"$RUNNER_TEMP/tara-backend.log" 2>&1 &
            backend_pid=$!
            for _ in $(seq 1 60); do
              if ! kill -0 "$backend_pid" 2>/dev/null; then cat "$RUNNER_TEMP/tara-backend.log"; return 1; fi
              if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then return 0; fi
              sleep 0.5
            done
            cat "$RUNNER_TEMP/tara-backend.log"
            return 1
          }
          start_backend
          python scripts/api-smoke.py create
          kill "$backend_pid" 2>/dev/null || true
          wait "$backend_pid" || true
          backend_pid=""
          start_backend
          python scripts/api-smoke.py verify
