name: Bug report
description: Report a reproducible Tara defect
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include recordings, transcripts, credentials, model files, or databases. Report security issues privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Tara version
      placeholder: v0.4.1-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Capture setup
      description: Microphone/system/both, headset or speakers, and whether local intelligence was installed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
